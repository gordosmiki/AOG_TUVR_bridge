name: Build AOG-TUVR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyserial

    - name: Read version
      id: ver
      shell: pwsh
      run: |
        $m = Select-String -Path AOG_TUVR_bridge.py -Pattern 'BRIDGE_VERSION = "([^"]+)"'
        $v = $m.Matches[0].Groups[1].Value
        Write-Host "Version: $v"
        "version=$v" >> $env:GITHUB_OUTPUT

    - name: Build AOG-TUVR
      run: |
        $ICON_FLAG = ""
        if (Test-Path "icon.ico") {
          $ICON_FLAG = "--icon=icon.ico"
        }
        pyinstaller --onefile --console --name "AOG-TUVR-v${{ steps.ver.outputs.version }}" $ICON_FLAG "AOG_TUVR_bridge.py"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AOG-TUVR-v${{ steps.ver.outputs.version }}
        path: dist/AOG-TUVR-v${{ steps.ver.outputs.version }}.exe

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.ver.outputs.version }}
        name: AOG-TUVR v${{ steps.ver.outputs.version }}
        target_commitish: ${{ github.sha }}
        files: dist/AOG-TUVR-v${{ steps.ver.outputs.version }}.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
